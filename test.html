<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script type="module">
        import '/main_installer.js';

        try {
            await window.mainInstallerReady;
        } catch (error) {
            console.error('Scratch runtime setup failed:', error);
            throw error;
        }

        window.onclick = async function () {
            Lucy.scriptmanager.evaluateStatement(`class Test {
            constructor() {}

            popup(message) {
            alert(message);
            }
            }
            
            let dialog = new Test();
            dialog.popup('test');`);
        }
    </script>
</body>

</html>
